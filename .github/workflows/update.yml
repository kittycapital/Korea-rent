name: Update Rent Dashboard

on:
  push:
    paths:
      - 'data/csv_jeonse/**'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate rent dashboards from CSV
        run: python fetch_all.py
      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update rent dashboard $(date +'%Y-%m-%d')" && git push)
